
services:
  mysql:
    image: mysql:8.0
    container_name: drawing_game_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password_change_me
      MYSQL_DATABASE: drawing_game
      MYSQL_USER: drawing_user
      MYSQL_PASSWORD: drawing_dev_password_change_me
    ports:
      - "3309:3306"
    volumes:
      - drawing_game_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_password_change_me"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  drawing_game_mysql_data:
